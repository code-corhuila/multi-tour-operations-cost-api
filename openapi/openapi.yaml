openapi: 3.0.3
info:
  title: Multi Tour — operations-cost (the operations built so far)
  version: 0.6.0
  description: |
    The copy of `07-api/contracts/openapi/operations-cost.yaml` (version 0.6.0, trimmed to what the service offers) that the contract gate loads (ADR-004 D7). It keeps
    only the operations the service already offers, with the same bodies and codes; each slice adds its own. Accepted
    differences from the design contract, to keep this copy self-contained: no `securitySchemes` (the token is judged by the
    service and tested apart), `Departure` flattened without `mark` and the typed lists, and the
    error body, the paging parameters and the paging meta defined here instead of in `_shared.yaml`; in `rescheduleDeparture` the tags and the extensions `x-hu` and `x-permission` are left out. Since 0.5.0 (HU-OPS-003 part A) `booked` of the list, of the reading and of the start and the end is the seats held that commercial-reservation keeps; the answers of scheduling, rescheduling and adding vehicles still answer 0. The mark of pending regularization is the field `pendingRegularization`, always `false` until part B. The design contract
    lives in `multi-tour-docs`. Operations offered: `getHealth`, `listDepartures`, `scheduleDeparture`, `getDeparture`, `registerStart`, `finishDeparture`, `rescheduleDeparture`, `createVehicle`, `listVehicles`, `addDepartureVehicles`, `listOutboxEvents`, `markOutboxEventPublished`, `recordOutboxEventAttempt`.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness, without a token
      responses:
        '200':
          description: The service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
  /api/v1/operations-cost/departures:
    get:
      operationId: listDepartures
      summary: List the departures of the tenant (HU-OPS-003)
      description: |
        Most recent scheduled start first. Each row reads its tour and its seats from commercial-reservation, once per tour of the page.
        A `limit` out of 1 to 100, a `page` below 1, an unknown `status` or an unknown parameter is `400`, never ignored. Departures of
        another tenant never appear. **Requires:** the permission `MANAGE_DEPARTURE_EXECUTION` (the Tenant Administrator and an
        Operational Collaborator it was granted to).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DepartureStatus'
      responses:
        '200':
          description: A page of departures
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Departure'
                  meta:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: scheduleDeparture
      summary: Schedule a departure of a tour (HU-OPS-001, RF-020, RN-SAL-001)
      description: |
        The Tenant Administrator schedules a departure of a tour of the catalog of their tenant; it is created `SCHEDULED` and
        gets the next code `SAL-NNN` of the tenant. A repeat with the same `Idempotency-Key` answers `200` with the departure
        already created. Since 0.4.0 (HU-OPS-002) it takes `vehicleIds`: for a tour that requires transport the departure starts
        with those vehicles; a vehicle on another departure whose interval overlaps, an unknown vehicle, or vehicles for a tour that
        does not require transport are `422 BUSINESS_RULE_VIOLATION`. **Requires:** `TENANT_ADMINISTRATOR`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleDepartureRequest'
      responses:
        '201':
          description: Scheduled; returns the departure as it is now
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the departure already created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/departures/{departureCode}:
    parameters:
      - $ref: '#/components/parameters/DepartureCode'
    get:
      operationId: getDeparture
      summary: Consult one departure (HU-OPS-003)
      description: |
        A departure of another tenant, or one that does not exist, is `404`. Its reservations and novelties come with HU-OPS-004.
        **Requires:** the permission `MANAGE_DEPARTURE_EXECUTION`.
      responses:
        '200':
          description: The departure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/departures/{departureCode}/executions:
    parameters:
      - $ref: '#/components/parameters/DepartureCode'
    post:
      operationId: registerStart
      summary: Register the actual start of the departure (HU-OPS-003, RN-EJE-001)
      description: |
        Only a `SCHEDULED` departure can start (`422 INVALID_STATUS_TRANSITION` otherwise). A start earlier than the scheduled start,
        or later than the moment it is recorded, is `422 BUSINESS_RULE_VIOLATION`. Writes `SalidaExecutionStarted` in the same
        transaction. A repeat with the same `Idempotency-Key` answers `200`. **Requires:** the permission `MANAGE_DEPARTURE_EXECUTION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExecutionRequest'
      responses:
        '201':
          description: Recorded; returns the departure as it is now
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the departure already recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/departures/{departureCode}/finish:
    parameters:
      - $ref: '#/components/parameters/DepartureCode'
    post:
      operationId: finishDeparture
      summary: Finish or interrupt the departure (HU-OPS-003, PDR K1)
      description: |
        Only from `IN_EXECUTION` (`422 INVALID_STATUS_TRANSITION` otherwise). `INTERRUPTED` needs its `cause` and `FINISHED` takes none
        (`400 VALIDATION_ERROR` otherwise); either way the departure ends `FINISHED`. An end earlier than the actual start, or later than
        the moment it is recorded, is `422 BUSINESS_RULE_VIOLATION`. Writes `SalidaFinalized` in the same transaction. A repeat with the
        same `Idempotency-Key` answers `200`. **Requires:** the permission `MANAGE_DEPARTURE_EXECUTION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishRequest'
      responses:
        '201':
          description: Recorded; returns the departure as it is now
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the departure already recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/departures/{departureCode}/schedule:
    parameters:
      - $ref: '#/components/parameters/DepartureCode'
    put:
      operationId: rescheduleDeparture
      summary: Change the date or the time of a scheduled departure (HU-OPS-001, RN-SAL-001)
      description: |
        Replaces the start and the estimated end of a departure that is `SCHEDULED` and has no reservations (AC3), keeping its code
        and its state. A departure with reservations is never changed: `422 BUSINESS_RULE_VIOLATION` (AC4). A departure that is
        not `SCHEDULED` is `422 INVALID_STATUS_TRANSITION`. Setting what is already set answers `200` and records nothing. A
        departure of another tenant is `404`. **Requires:** `TENANT_ADMINISTRATOR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleDepartureRequest'
      responses:
        '200':
          description: The departure as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/vehicles:
    get:
      operationId: listVehicles
      summary: List the vehicles of the tenant (HU-OPS-002)
      description: Sorted by name. Those of another tenant never appear. **Requires:** `TENANT_ADMINISTRATOR`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of vehicles
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Vehicle'
                  meta:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVehicle
      summary: Register a vehicle of the tenant (HU-OPS-002 AC1, RF-020)
      description: |
        A name of 1 to 60 characters and a capacity from 1 to 100 seats. A name already used by another vehicle of the tenant
        (upper and lower case and the spaces around it ignored) is `422 BUSINESS_RULE_VIOLATION`. A repeat with the same
        `Idempotency-Key` answers `200` with the vehicle already created. **Requires:** `TENANT_ADMINISTRATOR`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Registered
          headers:
            Location:
              description: Where the vehicles of the tenant are listed
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the vehicle already created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operations-cost/departures/{departureCode}/vehicles:
    parameters:
      - $ref: '#/components/parameters/DepartureCode'
    post:
      operationId: addDepartureVehicles
      summary: Add vehicles to a scheduled departure (HU-OPS-002 AC2, AC3, AC5)
      description: |
        Adds the vehicles to a `SCHEDULED` departure of a tour that requires transport; a vehicle already on it changes nothing, so
        a repeat answers `200` with the same departure and writes nothing. The new total goes to `commercial-reservation` through
        `SalidaVehiclesChanged`, written in the same transaction. A vehicle on another departure whose interval overlaps, an unknown
        vehicle, or a tour that does not require transport are `422 BUSINESS_RULE_VIOLATION`; a departure that is not `SCHEDULED`
        is `422 INVALID_STATUS_TRANSITION`; a departure of another tenant is `404`. Nothing here removes a vehicle (part B).
        **Requires:** `TENANT_ADMINISTRATOR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDepartureVehiclesRequest'
      responses:
        '200':
          description: The departure with its vehicles and its effective capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/operations-cost/internal/outbox:
    get:
      operationId: listOutboxEvents
      summary: Read the events waiting
      description: The pending events whose next attempt is due, oldest first, in pages. **Requires:** `SERVICE` role.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING]
            default: PENDING
      responses:
        '200':
          description: The events waiting
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboxEvent'
                  meta:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operations-cost/internal/departures/pending-regularization:
    post:
      tags: [Internal]
      operationId: markPendingRegularization
      summary: Mark the departures past their estimated end (job 3, HU-OPS-003 part B)
      description: |
        Marks as pending regularization, across tenants, up to `limit` departures `SCHEDULED` or `IN_EXECUTION` whose estimated end
        has passed and that are not marked, oldest estimated end first. A state never changes by time (RN-EJE-001). Safe to repeat:
        a departure already marked is skipped, and each one marked writes `SalidaMarkedPendienteDeRegularizacion` in the same
        transaction. Answers only a count. **Requires:** `SERVICE` role.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: How many were marked in this ask
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                additionalProperties: false
                properties:
                  marked:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/operations-cost/internal/outbox/{eventId}/published:
    parameters:
      - $ref: '#/components/parameters/EventIdPath'
    post:
      operationId: markOutboxEventPublished
      summary: Mark an event delivered
      description: An event already published stays as it is; one given up is published too. **Requires:** `SERVICE` role.
      responses:
        '200':
          description: The event is marked published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operations-cost/internal/outbox/{eventId}/attempts:
    parameters:
      - $ref: '#/components/parameters/EventIdPath'
    post:
      operationId: recordOutboxEventAttempt
      summary: Record a failed delivery
      description: Adds one to the attempts, keeps the error and moves the next attempt; the 20th attempt gives the event up. **Requires:** `SERVICE` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxAttemptRequest'
      responses:
        '200':
          description: The attempt is recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartureCode:
      name: departureCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^SAL-[0-9]{3,6}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^\S+$'
  headers:
    Location:
      description: Where the created departure can be read
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [error, message, traceId]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
        traceId:
          type: string
    DepartureStatus:
      type: string
      enum: [SCHEDULED, IN_EXECUTION, FINISHED, CANCELLED]
    OutboxEvent:
      type: object
      required: [eventId, eventType, eventVersion, tenantId, aggregateId, payload, correlationId, occurredAt, status, attempts, nextAttemptAt]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        eventVersion:
          type: integer
          minimum: 1
        tenantId:
          type: string
          format: uuid
        aggregateId:
          type: string
          format: uuid
        actorId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        payload:
          type: object
        correlationId:
          type: string
        occurredAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [PENDING, PUBLISHED, FAILED]
        attempts:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
    OutboxAttemptRequest:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
          maxLength: 1000
    RescheduleDepartureRequest:
      type: object
      required: [scheduledStart, scheduledEnd]
      additionalProperties: false
      properties:
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
    ScheduleDepartureRequest:
      type: object
      required: [serviceId, scheduledStart, scheduledEnd, timeZone]
      additionalProperties: false
      properties:
        serviceId:
          type: string
          format: uuid
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
        vehicleIds:
          description: Since 0.4.0 (HU-OPS-002). Only for a tour that requires transport; none is accepted for a tour that does not
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    Vehicle:
      type: object
      required: [vehicleId, name, capacity]
      additionalProperties: false
      properties:
        vehicleId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 60
        capacity:
          type: integer
          minimum: 1
          maximum: 100
    CreateVehicleRequest:
      type: object
      required: [name, capacity]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        capacity:
          type: integer
          minimum: 1
          maximum: 100
    AddDepartureVehiclesRequest:
      type: object
      required: [vehicleIds]
      additionalProperties: false
      properties:
        vehicleIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    Departure:
      type: object
      required: [code, serviceId, status, scheduledStart, scheduledEnd, capacity, booked, pendingRegularization, startAlert, vehicles, interrupted]
      properties:
        code:
          type: string
          pattern: '^SAL-[0-9]{3,6}$'
        serviceId:
          type: string
          format: uuid
        pendingRegularization:
          type: boolean
          description: Since 0.5.0, the mark of a departure past its estimated end with no closing (PDR section 16); set by job 3 since 0.6.0 and cleared when a person starts or finishes the departure
        startAlert:
          type: boolean
          description: Since 0.6.0, true while the departure is `SCHEDULED` and its scheduled start has passed; derived by the service, never stored
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        interrupted:
          type: boolean
          description: Since 0.5.0, whether the departure ended as an interruption (PDR K1); `false` until it ends
        interruptionCause:
          type: string
          maxLength: 1000
          description: Since 0.5.0, present only when `interrupted` is true
        status:
          $ref: '#/components/schemas/DepartureStatus'
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        capacity:
          type: integer
          description: Since 0.4.0, the effective capacity, the lower of `tourCapacity` and `vehicleCapacity` when the tour requires transport, `tourCapacity` otherwise
        booked:
          type: integer
        tourCapacity:
          type: integer
          description: Since 0.4.0, the capacity of the tour in the catalog of `commercial-reservation`
        vehicleCapacity:
          type: integer
          description: Since 0.4.0, the total capacity of the vehicles of the departure; `0` without vehicles
        transportRequired:
          type: boolean
          description: Since 0.4.0, whether the tour requires transport, as the catalog says
        vehicles:
          type: array
          maxItems: 20
          description: Since 0.4.0 each vehicle with its id, name and capacity (it was a list of names)
          items:
            $ref: '#/components/schemas/Vehicle'
        reservations:
          type: array
          description: Not answered until HU-OPS-004
          maxItems: 100
          items:
            type: object
        novelties:
          type: array
          maxItems: 200
          items:
            type: object
    StartExecutionRequest:
      type: object
      additionalProperties: false
      required: [startedAt]
      properties:
        startedAt:
          type: string
          format: date-time
    FinishRequest:
      type: object
      additionalProperties: false
      required: [finishedAt, result]
      properties:
        finishedAt:
          type: string
          format: date-time
        result:
          type: string
          enum: [FINISHED, INTERRUPTED]
        cause:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when `result` is `INTERRUPTED`, and not allowed when it is `FINISHED`
  responses:
    BadRequest:
      description: Validation error in the data sent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token missing or not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The role does not allow this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: A business rule refuses it (BUSINESS_RULE_VIOLATION) or the state does not allow it (INVALID_STATUS_TRANSITION)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: There is no such departure for the tenant of the token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Another domain that the operation needs to read did not answer; nothing was written
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
